      doc: 'any reaction value greater than this is considered good. Valid range: -125..125 (default: 10). The value must be greater than or equal to the `neutral` threshold'
    doc: |
      Sets the thresholds for "neutral" and "good" NPC reactions
    macro: sfall.h

