      type: ObjectPtr
    - name: StatID
      type: int
    opcode: 0x8161
  - name: get_stat_min
    type: int
    args:
    - name: stat
      type: int
    - name: who
      type: bool
      default: "False"
      doc: 0 (`False`) or omitting the argument - returns the value of the player, 1 (`True`) - returns the value set for other critters
    doc: |
      - Returns the minimum set value of the specified stat (see `set_stat_min` functions)
  - name: get_stat_max
    type: int
    args:
    - name: stat
      type: int
    - name: who
      type: bool
      default: "False"
      doc: 0 (`False`) or omitting the argument - returns the value of the player, 1 (`True`) - returns the value set for other critters
    doc: |
      - Returns the maximum set value of the specified stat (see `set_stat_max` functions)

- name: Alter min/max
  doc: The `set_stat_max/min` functions can be used to set the valid ranges on stats. Values returned by `get_current_stat` will be clamped to this range. The `set_pc_` function only affects the player, the `set_npc_` functions only affects other critters, and the `set_` functions affects both.
  parent: Stats
  items:
  - name: set_stat_max
    type: void
    args:
    - name: stat
      type: int
    - name: value
      type: int
    opcode: 0x81b4
  - name: set_stat_min
