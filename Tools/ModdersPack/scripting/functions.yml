      type: int
    opcode: 0x8244
  - name: get_available_skill_points
    type: int
    opcode: 0x8245

  - name: set_skill_max
    type: void
    args:
    - name: value
      type: int
    opcode: 0x81a2
    doc: Can't be used to increase the skill cap above 300.
  - name: set_critter_skill_mod
    type: void
    args:
    - name: critter
      type: ObjectPtr
    - name: max
      type: int
    opcode: 0x81c7
  - name: set_base_skill_mod
    type: void
    args:
    - name: max
      type: int
    opcode: 0x81c8
  - name: mod_skill_points_per_level
    type: void
    args:
    - name: value
      type: int
    doc: Accepts a value of between -100 and 100, and modifies the number of skill points the player recieves when they level up. This is a modification of what would otherwise happen, rather than a replacement. The value is not saved into the save game, so should be reset in the `game_loaded` section of a script.
    opcode: 0x8246

- name: Graphics
  doc: The graphics functions are only available if the user is using graphics mode 4 or 5. Use `graphics_funcs_available` to check; it returns 1 if you can use them or 0 if you can't. Calling graphics functions when `graphics_funcs_available` returns 0 will do nothing.
  items:
  - name: graphics_funcs_available
    type: bool
    opcode: 0x8165
  - name: load_shader
    type: int
    args:
    - name: path
      type: string
    doc: Takes a path relative to the `<GameRoot>\<master_patches>\shaders\` directory as an argument and returns a shader ID. That ID should be passed as the first argument to all other shader functions, and is valid until `free_shader` is called on the ID, the player loads a saved game or the player quits to the main menu.
    opcode: 0x8166
  - name: free_shader
    type: void
    args:
    - name: ID
      type: int
    opcode: 0x8167
  - name: activate_shader
    type: void
    args:
    - name: ID
      type: int
    opcode: 0x8168
  - name: deactivate_shader
    type: void
    args:
    - name: ID
      type: int
    opcode: 0x8169
  - name: set_shader_int
    type: void
    args:
    - name: ID
      type: int
    - name: param
      type: string
    - name: value
      type: int
    opcode: 0x816d
  - name: set_shader_float
    type: void
    args:
    - name: ID
      type: int
    - name: param
      type: string
    - name: value
      type: float
    opcode: 0x816e
  - name: set_shader_vector
    type: void
    args:
    - name: ID
      type: int
    - name: param
      type: string
    - name: f1
      type: float
    - name: f2
      type: float
    - name: f3
      type: float
    - name: f4
      type: float
    opcode: 0x816f
  - name: get_shader_version
    type: int
    doc: Gives you the highest shader version supported by the player's graphics cards. Possible return values are 11, 12, 13, 14, 20, 21 and 30.
    opcode: 0x81ad
  - name: set_shader_mode
    type: void
    args:
    - name: ID
      type: int
      doc: shader ID
    - name: mode
      type: int
      doc: a set of 32 flags which specify the screens on which the shader will be disabled, unless bit 32 is set, in which case the shader will only be active on those screens. Remember that screens are displayed on top of each other; if the player opens the character menu which in combat, the game still considers the player to be in combat. See **sfall.h** for a list of defines.
    opcode: 0x81ae
    doc: |
      Tells sfall when to use a shader.
  - name: force_graphics_refresh
    type: void
    args:
    - name: enabled
      type: bool
    opcode: 0x81b0
    doc: Forces the screen to redraw at times when it normally wouldn't. If you're using animated shader, turning this option on is recommended.
  - name: get_shader_texture
    type: int
    args:
    - name: ID
      type: int
    - name: texture
      type: int
    opcode: 0x81b1
  - name: set_shader_texture
    type: void
    args:
    - name: ID
      type: int
    - name: param
      type: string
    - name: texID
      type: int
    opcode: 0x81b2
  - name: get_screen_width
    type: int
    opcode: 0x8220
  - name: get_screen_height
    type: int
    opcode: 0x8221
  - name: set_palette
    type: void
    args:
    - name: path
      type: string
    opcode: 0x81f2

