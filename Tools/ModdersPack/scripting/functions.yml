- name: Sfall funcX macros
  items:
  - name: critter_inven_obj2
    type: ObjectPtr
    args:
    - name: obj
      type: ObjectPtr
    - name: type
      type: int
    doc: Works just like vanilla `critter_inven_obj`, but correctly reports item in player's inactive hand slot.
    macro: sfall.h
  - name: item_weight
    type: int
    args:
    - name: obj
      type: ObjectPtr
    doc: Returns the weight of an item object.
    macro: sfall.h

  - name: spatial_radius
    type: int
    args:
    - name: obj
      type: ObjectPtr
    doc: Returns radius of spatial script, associated with the given dummy object (returned by `create_spatial`).
    macro: sfall.h
  - name: set_rest_heal_time
    type: void
    args:
    - name: time
      type: int
    doc: |
      Sets the time interval in minutes for healing during resting. The default is 180
      - the time interval will be reset each time the player reloads the game
    macro: sfall.h
  - name: set_worldmap_heal_time
    type: void
    args:
    - name: time
      type: int
    doc: |
      Sets the time interval in minutes for healing during world map travel. The default is 180
      - passing 0 will revert to 1 second of real time (vanilla engine behavior)
      - passing -1 will disable healing during travel
      - the time interval will be reset each time the player reloads the game
    macro: sfall.h
  - name: set_rest_mode
    type: void
    args:
    - name: flags
      type: int
    doc: 'Sets the bit flags for the rest mode (see `RESTMODE_*` constants in **sfall.h**). Passing 0 will reset the rest mode. It will also be reset each time the player reloads the game.'
    macro: sfall.h

  - name: get_metarule_table
    type: array
    doc: Returns names of all currently available script functions.
    macro: sfall.h

  - name: dialog_message
    type: void
    args:
    - name: text
      type: string
    doc: Displays a message in the NPC response window in dialog or barter screen.
    macro: sfall.h

  - name: get_current_inven_size
    type: int
    args:
    - name: object
      type: ObjectPtr
    doc: Returns the total size of items in a container or a critter's inventory.
    macro: sfall.h

  - name: get_object_ai_data
    type: int
    args:
    - name: object
      type: ObjectPtr
    - name: aiParam
      type: int
    doc: Returns the setting value from the AI packet of an object (critter). Use `AI_CAP_*` constants from **define_extra.h** for the `aiParam` argument to get AI value.
    macro: sfall.h

  - name: npc_engine_level_up
    type: void
    args:
    - name: toggle
      type: bool
    doc: Enables/disables the engine function that increases the level of party members in the player leveling process. If the engine function is disabled, the process of leveling up party members should be performed by script functions.
    macro: sfall.h

  - name: set_drugs_data
    type: void
    args:
    - name: type
      type: int
    - name: pid
      type: int
    - name: value
      type: int
    doc: "Overrides the parameters of drugs set in the configuration file (`DrugsFile` setting in `ddraw.ini`). Type: 0 - changes the value of `NumEffects` for the drug (see `Drugs.ini` for the description of `NumEffects`), 1 - changes the duration of the addiction effect for the drug (a value of 1 = one game minute)."
    macro: sfall.h

  - name: metarule_exist
    type: bool
    args:
    - name: metaruleName
      type: string
    doc: Returns True if the specified name of metarule (sfall_funcX) function exists in the current version of sfall.
    macro: sfall.h

  - name: opcode_exists
    type: bool
    args:
    - name: opcodeNum
      type: int
      doc: starts at `0x8000`.
    doc: |
      Returns True if an opcode with the specified number exists in the current version of sfall.
    macro: sfall.h

  - name: add_extra_msg_file
    type: int
    args:
    - name: fileName
      type: string
      doc: the name of the custom message file (including the .msg extension) in `text\<language>\game\` directory.
    doc: |
      Loads a custom message file and returns the file ID number assigned to it, in the range of 0x3000 to 0x3FFF, for use with the `message_str_game` function.
      - __NOTE:__ if the msg file does not exist in the current language directory, the function will try to load it from the `text\English\game\` directory.

      Alternative form: `int add_extra_msg_file(string fileName, int fileNumber)` **[DEPRECATED]**
      - __Deprecation notice:__ Starting from sfall 4.5/3.8.50, the two-argument form is deprecated. The `fileNumber` argument is ignored, and the function behaves the same as the one-argument form.
    macro: sfall.h

  - name: remove_all_timer_events
    type: void
    metarule: remove_timer_event
    doc: Clears all set timer events for the current global script.
    macro: sfall.h
  - name: remove_timer_event
    type: void
    metarule: remove_timer_event
    args:
    - name: fixedParam
      type: int
    doc: Removes all timer events with the specified `fixedParam` value for the current global script.
    macro: sfall.h

  - name: hide_win
    type: void
    metarule: hide_window
    doc: Hides currently active (selected) script window.
    macro: sfall.h
  - name: hide_window
    type: void
    metarule: hide_window
    args:
    - name: winName
      type: string
      doc: the window name, assigned to the window by the `CreateWin/create_win` function
    doc: |
      Hides the specified script window.
    macro: sfall.h
  - name: show_win
    type: void
    metarule: show_window
    doc: Displays the script window previously hidden with the `sfall_func0("hide_window")` function.
    macro: sfall.h
  - name: show_window
    type: void
    metarule: show_window
    args:
    - name: winName
      type: string
      doc: the window name, assigned to the window by the `CreateWin/create_win` function
    doc: |
      Displays the specified hidden script window.
    macro: sfall.h

  - name: get_text_width
    type: int
    args:
    - name: text
      type: string
    doc: Returns the text width in pixels for the currently set font.
    macro: sfall.h

  - name: string_compare
    type: bool
    metarule: string_compare
    args:
    - name: str1
      type: string
    - name: str2
      type: string
    doc: Compares two strings case-insensitive, and returns `True` if the two strings are matched.
    macro: sfall.h
  - name: string_compare_locale
    type: bool
    metarule: string_compare
    args:
    - name: str1
      type: string
    - name: str2
      type: string
    - name: codePage
      type: int
      doc: 'code page number to properly compare national characters in the range 128-255 of the ASCII code table, available encodings: 1250-1252, 866'
    doc: |
      Compares two strings case-insensitive, and returns `True` if the two strings are matched
    macro: sfall.h

  - name: objects_in_radius
    type: array
    args:
    - name: tile
      type: int
    - name: radius
      type: int
    - name: elevation
      type: int
    - name: type
      type: int
      doc: passing -1 or _not specifying it_ will return all objects within the radius
    doc: |
      - returns an array of objects of a type (see `OBJ_TYPE_*` constants in **define_extra.h**) within the specified radius from the given tile
      - the radius is limited to 50 hexes
    macro: sfall.h

