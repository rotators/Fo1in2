    doc: Makes object change its direction to face the given tile number or target object.
    opcode: 0x8260
  - name: reg_anim_callback
    type: void
    args:
    - name: proc
      type: procedure
    doc: Adds the given procedure to an animation sequence-list and executes it in the registered sequence.
    opcode: 0x827e
  - name: reg_anim_animate_and_move
    type: void
    args:
    - name: obj
      type: ObjectPtr
    - name: tile
      type: int
    - name: animID
      type: int
    - name: delay
      type: int
      doc: delay from the previous animation. A value of -1 will execute the specified animation immediately after the previous one in the sequence ends.
    doc: |
      Plays the specified animation while simultaneously moving the object to the given tile.
