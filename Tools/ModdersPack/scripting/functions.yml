- name: Tiles and paths
  items:
  - name: get_tile_fid
    type: int
    args:
    - name: tileData
      type: int
    doc: |
      - Returns FID information about the square under the given tile at elevation 0
      - Pass elevation as 4-bit number in bits 25-28 to access other elevations
      - Pass result mode in bits 29-32: 0 - ground FID, 1 - roof FID, 2 - raw data.
    opcode: 0x823a
  - name: tile_under_cursor
    type: int
    opcode: 0x824b
  - name: tile_light
    type: int
    args:
    - name: elevation
      type: int
    - name: tileNum
      type: int
    doc: Returns light intensity at the given tile in the range of 0 to 65536.
    opcode: 0x826d
  - name: tile_get_objs
    type: array
    args:
    - name: tileNum
      type: int
    - name: elevation
      type: int
    doc: |
      Returns an array of all objects at the given tile.
      - It will include any hidden, dead or system objects (like cursor), so make sure to check properly when iterating.
    opcode: 0x8270
  - name: tile_refresh_display
    type: void
    doc: Redraws the game scene (tiles, walls, objects, etc.).
  - name: obj_blocking_tile
    type: ObjectPtr
    args:
    - name: tileNum
      type: int
    - name: elevation
      type: int
    - name: blockingType
      type: int
    doc: Returns the first object blocking the given tile using the given blocking function, or 0 if the tile is clear.
    opcode: 0x826f

  - name: tile_by_position
    type: int
    args:
    - name: x
      type: int
    - name: y
      type: int
    doc: |
      - returns the tile number at the x, y position relative to the top-left corner of the screen
      - if the position is outside of the range of tiles, it will return -1
    macro: sfall.h
  - name: get_tile_ground_fid
    type: int
    args:
    - name: tileNum
      type: int
    - name: elevation
      type: int
    doc: Returns FID of a ground tile at the given tile number and elevation.
    macro: sfall.h
  - name: get_tile_roof_fid
    type: int
    args:
    - name: tileNum
      type: int
    - name: elevation
      type: int
    doc: Returns FID of a roof tile at the given tile number and elevation. Note that FID of 1 is used when there is no actual roof.
    macro: sfall.h

  - name: obj_blocking_line
    type: ObjectPtr
    args:
    - name: objFrom
      type: ObjectPtr
      doc: always excluded from calculations, but is required to be a valid object.
    - name: tileTo
      type: int
    - name: blockingType
      type: int
    doc: |
      Returns the first object which blocks direct linear path from `objFrom` to `tileTo` using selected blocking function (see `BLOCKING_TYPE_*` constants in **sfall.h**).
      - If path is clear (no blocker was encountered by selected function) - returns 0.
    opcode: 0x826e
  - name: path_find_to
    type: array
    args:
    - name: objFrom
      type: ObjectPtr
    - name: tileTo
      type: int
    - name: blockingType
      type: int
    doc: |
      Returns the shortest path to a given tile using the given blocking function as an array of tile directions (0..5) to move on each step.
      - Array length equals to a number of steps.
      - Empty array means that specified target cannot be reached.
    opcode: 0x8272

