# Important notes on format:
#
# 1. The file must be valid YAML. (Use VScode with YAML extension to check).
#
# 2. General structure:
# - name: Category name           # REQUIRED, must be UNIQUE
#   parent: Parent category name  # OPTIONAL. If set, will generate a subcategory page on the site. Parent category must exist.
#   doc: Category doc             # OPTIONAL. Must be RELEVANT for ALL functions in the category. Will be displayed in IDE for EACH function under this category, in addition to function's individual doc.
#   items:
#   - name: function_name                                     # REQUIRED
#     type: void                                              # REQUIRED. Return type.
#     metarule: funcName                                      # OPTIONAL. Called as sfall_funcN("funcName", args...); N is the number of args passed.
#     args:                                                   # OPTIONAL. Omit for a function called without parentheses.
#     - name: obj                                             # REQUIRED
#       type: ObjectPtr                                       # REQUIRED
#       doc: argument documentation in markdown format        # OPTIONAL. Will be displayed in IDE.
#       optional: true                                        # OPTIONAL. Only with metarule: the argument can be omitted, along with every argument after it.
#       default: "0"                                          # OPTIONAL. Value used when the argument is omitted.
#     detail: x div y                                         # Only for what is not a function call (operators, variadic functions); replaces type and args. SINGLE line.
#     doc: fuction documentation in markdown format           # OPTIONAL. Will be displayed in IDE.
#     opcode: function opcode                                 # OPTIONAL
#     unsafe: true/false                                      # OPTIONAL. Whether it requires AllowUnsafeScripting.
#     deprecated: true or a message                           # OPTIONAL. The function should not be used; the message says why or what to use instead.
#     macro: header file name                                 # OPTIONAL. What to include to use this.

- name: Direct memory access # just parent page

- name: read_xxx
  parent: Direct memory access
  doc: These functions take a memory address as the parameter and can read arbitrary pieces of Fallout's address space.
  items:
  - name: read_byte
    type: int
    args:
    - name: address
      type: int
    opcode: 0x8156
  - name: read_short
    type: int
    args:
    - name: address
      type: int
    opcode: 0x8157
  - name: read_int
    type: int
    args:
